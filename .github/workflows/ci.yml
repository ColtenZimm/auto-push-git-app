name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: git config --global user.name ci && git config --global user.email ci@example.com
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  exe:
    name: single executable (${{ matrix.exe }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: linux-x64
          - os: windows-latest
            exe: win-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:exe
      - run: node scripts/smoke-exe.mjs dist/autopush-${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: autopush-${{ matrix.exe }}
          path: dist/autopush-*
          if-no-files-found: error
          retention-days: 14
